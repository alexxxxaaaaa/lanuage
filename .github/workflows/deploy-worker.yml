# 后端 Worker 的自动部署。
#
# 前端（client）走的是 Cloudflare Pages 的 Git 集成，push main 它自己会构建，
# 不需要这里管。Worker 没有 Git 集成，所以由这个 workflow 代替人工
# `cd server && npm run wrangler:deploy`——这样协作者只要有仓库 push 权限，
# 不用登录 Cloudflare 也能发布后端。
#
# 需要的仓库 secret（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   —— Edit Cloudflare Workers 模板生成的 token
#   CLOUDFLARE_ACCOUNT_ID  —— Cloudflare 控制台右侧的 Account ID
#
# 注意：`wrangler deploy` 不会动已有的 Worker secret（JWT_SECRET、
# OPENAI_API_KEY 等），也不会跑 D1 迁移。改了 schema 仍然要人工执行
# 一次迁移，见 DEPLOY.md 的 "Schema change"。
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  # 允许在 Actions 页面手动点一下重发（比如只想回滚/重试，没有代码改动）
  workflow_dispatch:

# 同时push两次时，让后一次排队而不是并发部署，避免旧版本盖掉新版本
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 根目录是 npm workspaces，一次装齐 server 需要的依赖
      - run: npm ci

      # Prisma 7 不再在 install 时自动 generate，worker.ts 依赖生成的 client
      - run: npm run prisma:generate -w server

      - name: Typecheck
        run: npm run typecheck -w server

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
