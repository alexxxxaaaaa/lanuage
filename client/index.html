<!doctype html>
<!-- ThemeProvider stamps class/data-theme on <html> at module-evaluation time,
     before React's first render. Starting neutral here avoids a light-mode
     flash on a dark-mode reload. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Unscoped tag is the one ThemeProvider rewrites; the media-scoped pair
         below keeps the browser chrome correct before the bundle evaluates. -->
    <meta name="theme-color" content="#f0f1f3" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f1f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c0f" />
    <!-- 无前缀的标准名，WebKit 从 Safari 17.4 起就认它；manifest 里的
         `display: standalone` 是同一件事的另一半。带 apple- 前缀的那条是
         iOS 17.4 之前的遗留写法，重复声明只会在控制台多一条弃用警告。 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Word Sprint" />
    <!-- iOS 上让已安装的 web app 真正铺满屏幕（内容画到状态栏和主屏指示条
         底下）只有这一个开关 —— manifest 的 `display: fullscreen` 在 iOS 上
         是被忽略的。Apple 已把它标为 deprecated 且没给替代品：等哪天它失效，
         视口会退回安全区以内，届时 env(safe-area-inset-*) 全部归零，下面按
         这些变量做的内缩自动变成 0，布局两种模式下都成立。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Word Sprint</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
